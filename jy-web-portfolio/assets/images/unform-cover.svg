    <linearGradient id="arch" x2="1" y2=".7"><stop stop-color="#eadfc9"/><stop offset=".5" stop-color="#a79d86"/><stop offset="1" stop-color="#d7cbb0"/></linearGradient>
    <linearGradient id="sphere" x1=".1" y1=".1" x2=".9" y2=".9"><stop stop-color="#efc3af"/><stop offset=".6" stop-color="#bb7f6c"/><stop offset="1" stop-color="#694638"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#d6cebc"/><stop offset="1" stop-color="#aea28e"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#9ba58d" stop-opacity=".3"/><stop offset="1" stop-color="#9ba58d" stop-opacity="0"/></radialGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="18"/></filter>
