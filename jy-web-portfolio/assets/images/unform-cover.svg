<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">UNFORM — Digital Museum project cover</title>
  <desc id="desc">An original portfolio cover, not a screenshot: an architectural frame and abstract sculptural forms in ivory, graphite and muted coral.</desc>
  <defs>
